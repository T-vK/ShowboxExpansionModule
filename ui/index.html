<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0c10">
  <meta name="apple-mobile-web-app-title" content="ShowboxMod">
  <meta name="application-name" content="ShowboxMod">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>ShowboxMod</title>
  <style>
    .boot-retry {
      display: none;
      margin-top: 10px;
      padding: 8px 18px;
      font: inherit;
      color: #e8e6df;
      background: #1a1d26;
      border: 1px solid #3a3f4d;
      border-radius: 8px;
    }
    .boot-failed .boot-retry { display: inline-block; }
    .boot-failed .lead { color: #e07a7a; }
  </style>
</head>
<body>
  <div id="app">
    <div class="shell">
      <header class="topbar">
        <div id="bootbox">
          <h1>ShowboxMod</h1>
          <p class="lead">Loading mixer…</p>
          <button class="boot-retry" onclick="location.reload()">Retry</button>
        </div>
      </header>
    </div>
  </div>
  <script>
    // If the app bundle (or its css) dies mid-transfer on the BLE-coex
    // radio, show a retry button instead of a blank page.
    window.addEventListener("error", (e) => {
      if (window.__uiBooted || window.__uiFailed) return;
      const tag = e.target && e.target.tagName;
      if (tag === "SCRIPT" || tag === "LINK") {
        window.__uiFailed = true;
        const box = document.getElementById("bootbox");
        if (box) {
          box.classList.add("boot-failed");
          const lead = box.querySelector(".lead");
          if (lead) lead.textContent = "Load failed — the radio link dropped it.";
        }
      }
    }, true);
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
