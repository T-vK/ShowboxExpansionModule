<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0c10">
  <meta name="apple-mobile-web-app-title" content="ShowboxMod">
  <meta name="application-name" content="ShowboxMod">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>ShowboxMod</title>
  <style>
    /* Self-contained boot splash in the app's exact palette (#0b0c10/#15171d/
       accent #4ec4d4) — the app CSS is still on the radio at this point. */
    html, body { margin: 0; padding: 0; background: #0b0c10; }
    #boot {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: #e8e6df;
    }
    .boot-card {
      width: min(26rem, calc(100vw - 3rem));
      background: #15171d;
      border: 1px solid #2b3040;
      border-radius: 14px;
      padding: 1.6rem 1.6rem 1.4rem;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
    }
    .boot-card h1 {
      margin: 0 0 .2rem;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #e8e6df;
    }
    .boot-card h1 span { color: #4ec4d4; }
    .boot-sub { margin: 0 0 1rem; font-size: .8rem; color: #9aa0ad; }
    .boot-bar {
      height: 8px;
      border-radius: 6px;
      background: #1c1f27;
      border: 1px solid #2b3040;
      overflow: hidden;
      position: relative;
    }
    .boot-fill {
      height: 100%;
      width: 0%;
      border-radius: 6px;
      background: linear-gradient(90deg, #2c6d78, #4ec4d4);
      transition: width .25s ease;
    }
    .boot-fill.indeterminate {
      width: 38%;
      animation: bootslide 1.1s ease-in-out infinite alternate;
    }
    @keyframes bootslide { from { margin-left: 0; } to { margin-left: 62%; } }
    .boot-status {
      margin: .55rem 0 0;
      font-size: .78rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #8fe4ee;
      min-height: 1.1em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .boot-retry {
      display: none;
      margin-top: .9rem;
      padding: .5rem 1.1rem;
      font: inherit;
      font-size: .85rem;
      color: #e8e6df;
      background: #1c1f27;
      border: 1px solid #3a3f4d;
      border-radius: 8px;
      cursor: pointer;
    }
    .boot-retry:active { background: #2b3040; }
    .boot-failed .boot-retry { display: inline-block; }
    .boot-failed .boot-fill { background: #c4453c; animation: none; width: 100%; }
    .boot-failed .boot-status { color: #e07a7a; }
  </style>
</head>
<body>
  <div id="app">
    <div id="boot">
      <div class="boot-card">
        <h1>Showbox<span>Mod</span></h1>
        <p class="boot-sub">Mixer remote</p>
        <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
        <p class="boot-status" id="boot-status">Connecting…</p>
        <button class="boot-retry" onclick="location.reload()">Retry</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
