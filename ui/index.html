<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0c10">
  <meta name="apple-mobile-web-app-title" content="ShowboxMod">
  <meta name="application-name" content="ShowboxMod">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>ShowboxMod</title>
  <style>
    /* Self-contained boot splash in the app's exact palette — the single-file
       bundle replaces this node when it mounts. Vite inlines the app CSS into
       this same document, so once loaded everything is styled natively. */
    html, body { margin: 0; padding: 0; background: #0b0c10; }
    #app:empty::after {
      content: "";
      display: block;
      height: 100vh;
    }
    .boot-card {
      position: fixed;
      left: 50%;
      bottom: 18vh;
      transform: translateX(-50%);
      width: min(26rem, calc(100vw - 3rem));
      background: #15171d;
      border: 1px solid #2b3040;
      border-radius: 14px;
      padding: 1.4rem 1.6rem;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: #e8e6df;
      z-index: 9999;
    }
    .boot-card h1 {
      margin: 0 0 .2rem;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .boot-card h1 span { color: #4ec4d4; }
    .boot-bar {
      margin-top: .8rem;
      height: 8px;
      border-radius: 6px;
      background: #1c1f27;
      border: 1px solid #2b3040;
      overflow: hidden;
    }
    .boot-fill {
      height: 100%;
      width: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, #2c6d78, #4ec4d4, #2c6d78);
      background-size: 200% 100%;
      animation: bootslide 1.2s linear infinite;
    }
    @keyframes bootslide { from { background-position: 0% 0; } to { background-position: -200% 0; } }
    .boot-status {
      margin: .55rem 0 0;
      font-size: .78rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #8fe4ee;
    }
    .boot-card.boot-failed .boot-fill {
      background: #c4453c;
      animation: none;
    }
    .boot-card.boot-failed .boot-status { color: #e07a7a; }
    .boot-retry {
      display: none;
      margin-top: .9rem;
      padding: .5rem 1.1rem;
      font: inherit;
      font-size: .85rem;
      color: #e8e6df;
      background: #1c1f27;
      border: 1px solid #3a3f4d;
      border-radius: 8px;
      cursor: pointer;
    }
    .boot-card.boot-failed .boot-retry { display: inline-block; }
  </style>
</head>
<body>
  <div id="app">
    <div class="boot-card" id="boot-card">
      <h1>Showbox<span>Mod</span></h1>
      <div class="boot-bar"><div class="boot-fill"></div></div>
      <p class="boot-status" id="boot-status">Loading mixer…</p>
      <button class="boot-retry" onclick="location.reload()">Retry</button>
    </div>
  </div>
  <script>
    // The single-file bundle loads as one module script. If the radio drops
    // the transfer, retry automatically a few times (session-scoped) before
    // showing the manual Retry button — no custom loader to maintain.
    (function () {
      var card = document.getElementById("boot-card");
      var status = document.getElementById("boot-status");
      var key = "bootRetries";
      var n = 0;
      try { n = parseInt(sessionStorage.getItem(key) || "0", 10); } catch (e) {}
      window.addEventListener("error", function (e) {
        var tag = e.target && e.target.tagName;
        if (window.__uiBooted || tag !== "SCRIPT") return;
        if (n < 2) {
          n++;
          try { sessionStorage.setItem(key, String(n)); } catch (err) {}
          status.textContent = "Radio dropped the bundle — retrying (" + n + "/2)…";
          setTimeout(function () { location.reload(); }, 1500);
        } else {
          card.classList.add("boot-failed");
          status.textContent = "Load failed — the radio link dropped it. Tap Retry.";
          try { sessionStorage.removeItem(key); } catch (err) {}
        }
      }, true);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
